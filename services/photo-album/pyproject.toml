[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enheritage-photo-album"
version = "0.1.0"
description = "Photo album management with AI captioning and S3 storage"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "openai>=1.35.0",
    "Pillow>=10.3.0",
    "psycopg2-binary>=2.9.0",
    "python-multipart>=0.0.9",
    "tenacity>=8.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
