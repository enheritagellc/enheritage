[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "enheritage-transcription"
version = "0.1.0"
description = "Audio transcription service using Whisper and speaker diarization"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "boto3>=1.34.0",
    "openai-whisper>=20231117",
    "torch>=2.3.0",
    "pyannote.audio>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
