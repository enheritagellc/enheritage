# Required secrets (set in repository or organisation settings):
#   AWS_DEPLOY_ROLE_ARN  — IAM role ARN for GitHub Actions OIDC federation.
#                          The role must have ECS, ECR, and Terraform state
#                          (S3 + DynamoDB) permissions for the staging account.
#   SLACK_WEBHOOK_URL    — (optional) Incoming webhook URL for deployment
#                          notifications.
#
# This workflow is triggered automatically when the "Docker build & push"
# workflow completes on main, and can also be triggered manually via
# workflow_dispatch.  Deployments run against the `staging` GitHub Environment,
# which should be configured with any required wait timers or reviewers.

name: Deploy – Staging

on:
  workflow_run:
    workflows:
      - Docker build & push
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    environment: staging

    # For workflow_run triggers, only proceed when the upstream workflow
    # succeeded.  workflow_dispatch always proceeds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Setup Terraform 1.8.0
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform init
        run: |
          terraform -chdir=infra/terraform init \
            -var-file=environments/staging.tfvars

      - name: Terraform plan
        id: plan
        run: |
          terraform -chdir=infra/terraform plan \
            -var-file=environments/staging.tfvars \
            -out=tfplan \
            -detailed-exitcode
        # exit code 0 = no changes, 1 = error, 2 = changes present
        continue-on-error: true

      - name: Upload Terraform plan artefact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-staging-${{ github.run_id }}
          path: infra/terraform/tfplan
          retention-days: 7

      - name: Fail if Terraform plan errored
        if: steps.plan.outputs.exitcode == '1'
        run: exit 1

      - name: Terraform apply
        if: steps.plan.outputs.exitcode == '2'
        run: terraform -chdir=infra/terraform apply tfplan

      - name: Force new ECS deployments
        run: |
          SERVICES=(
            auth
            interview
            media-ingestion
            enrichment
            family-tree
            keepsake-render
            notification
            vault
            transcription
            nlp-ner
            biography-gen
            photo-album
          )
          for SERVICE in "${SERVICES[@]}"; do
            echo "Triggering new deployment for: $SERVICE"
            aws ecs update-service \
              --cluster enheritage-staging \
              --service "$SERVICE" \
              --force-new-deployment \
              --no-cli-pager
          done

      - name: Wait for ECS services to stabilise
        run: |
          aws ecs wait services-stable \
            --cluster enheritage-staging \
            --services \
              auth \
              interview \
              media-ingestion \
              enrichment \
              family-tree \
              keepsake-render \
              notification \
              vault \
              transcription \
              nlp-ner \
              biography-gen \
              photo-album

      - name: Smoke test – health endpoint
        run: curl -f https://api-staging.enheritage.com/health || exit 1

      - name: Notify Slack on success
        if: success() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": ":white_check_mark: *Staging deploy succeeded* — `${{ github.sha }}` deployed to <https://api-staging.enheritage.com|api-staging.enheritage.com>"
            }'

      - name: Notify Slack on failure
        if: failure() && secrets.SLACK_WEBHOOK_URL != ''
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H 'Content-Type: application/json' \
            -d '{
              "text": ":x: *Staging deploy FAILED* — `${{ github.sha }}` — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
            }'
