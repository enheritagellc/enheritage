name: Setup Python with uv
description: >
  Sets up Python 3.12, installs uv via pip, and runs uv sync --frozen in the
  specified working directory.

inputs:
  working-directory:
    description: Path to the Python service directory where uv sync will be run
    required: true

runs:
  using: composite
  steps:
    - name: Setup Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install uv
      shell: bash
      run: pip install uv

    - name: Sync dependencies with uv
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync --frozen
